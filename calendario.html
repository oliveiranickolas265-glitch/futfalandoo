 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendário do Brasileirão</title>

    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light py-4">

    <div class="container">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                <h5 class="mb-0 fw-bold">📅 Calendário de Jogos - Brasileirão</h5>
                <span class="badge bg-success px-3 py-2">Rodada Atual</span>
            </div>
            
        
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-secondary text-uppercase fs-7">
                        <tr>
                            <th scope="col" class="text-center" style="width: 8%;">Rodada</th>
                            <th scope="col" style="width: 15%;">Data & Hora</th>
                            <th scope="col" class="text-end" style="width: 25%;">Mandante</th>
                            <th scope="col" class="text-center bg-light-subtle" style="width: 14%;">Placar</th>
                            <th scope="col" class="text-start" style="width: 25%;">Visitante</th>
                            <th scope="col" style="width: 13%;">Estádio</th>
                        </tr>
                    </thead>
                    <tbody>

                        <tr>
                            <td class="text-center fw-bold text-muted">1ª</td>
                            <td>
                                <div class="fw-semibold">18/04</div>
                                <small class="text-secondary">Sábado - 16:00</small>
                            </td>
                            <td class="text-end fw-bold">
                                Flamengo <span class="ms-2"></span>
                            </td>
                            <td class="text-center bg-light-subtle">
                                <span class="badge bg-dark fs-6 px-2 py-1">2</span>
                                <span class="mx-1 fw-bold text-muted">x</span>
                                <span class="badge bg-dark fs-6 px-2 py-1">1</span>
                            </td>
                            <td class="text-start fw-bold">
                                <span class="me-2"></span> Palmeiras
                            </td>
                            <td>
                                <small class="d-block text-truncate" title="Maracanã">Maracanã</small>
                            </td>
                        </tr>

                
                        <tr>
                            <td class="text-center fw-bold text-muted">1ª</td>
                            <td>
                                <div class="fw-semibold">19/04</div>
                                <small class="text-secondary">Domingo - 16:00</small>
                            </td>
                            <td class="text-end fw-bold">
                                São Paulo <span class="ms-2"></span>
                            </td>
                            <td class="text-center bg-light-subtle">
                                <span class="badge bg-dark fs-6 px-2 py-1">0</span>
                                <span class="mx-1 fw-bold text-muted">x</span>
                                <span class="badge bg-dark fs-6 px-2 py-1">0</span>
                            </td>
                            <td class="text-start fw-bold">
                                <span class="me-2"></span> Corinthians
                            </td>
                            <td>
                                <small class="d-block text-truncate" title="Morumbis">Morumbis</small>
                            </td>
                        </tr>

            
                        <tr>
                            <td class="text-center fw-bold text-muted">2ª</td>
                            <td>
                                <div class="fw-semibold">25/04</div>
                                <small class="text-secondary">Sábado - 18:30</small>
                            </td>
                            <td class="text-end fw-bold text-secondary">
                                Atlético-MG <span class="ms-2"></span>
                            </td>
                            <td class="text-center bg-light-subtle">
                                <span class="badge bg-secondary-subtle text-dark fs-6 px-3 py-1">-</span>
                            </td>
                            <td class="text-start fw-bold text-secondary">
                                <span class="me-2"></span> Athletico
                            </td>
                            <td>
                                <small class="d-block text-truncate" title="Arena MRV">Arena MRV</small>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://jsdelivr.net"></script>
</body>
</html>

</body>
</html>
